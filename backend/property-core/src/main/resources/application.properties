# Application
spring.application.name=property-core

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/property_management
spring.datasource.username=property_admin
spring.datasource.password=${POSTGRES_PASSWORD}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Authentication
app.jwt.issuer=property-core
app.jwt.access-token-expiration=900
app.jwt.secret=${JWT_SECRET}
app.jwt.refresh-token-expiration=604800

# Required deployment secrets and exact browser origins (comma-separated).
app.browser.csrf-secret=${BROWSER_CSRF_SECRET}
app.browser.allowed-origins=${BROWSER_ALLOWED_ORIGINS}
app.browser.cookie-mode=production

# run the application on port 8081
server.port=8081
# Do not infer a trusted origin from client-supplied forwarding headers.
server.forward-headers-strategy=none
