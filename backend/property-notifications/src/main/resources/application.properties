spring.application.name=property-notifications
server.port=8082
spring.graphql.http.path=/api/graphql
spring.graphql.http.sse.keep-alive=15s
spring.graphql.http.sse.timeout=65s
spring.graphql.graphiql.enabled=false
spring.http.codecs.max-in-memory-size=128KB
app.core-url=${CORE_URL:http://localhost:8081}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=property-core
management.endpoints.web.exposure.include=health,metrics
management.tracing.export.zipkin.enabled=${ZIPKIN_ENABLED:false}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=${TRACE_SAMPLING_PROBABILITY:0.1}
