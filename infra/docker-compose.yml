
services:
  postgres:
    image: postgres:15-alpine
    container_name: property-saas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: property_management
      POSTGRES_USER: property_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - property_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_admin -d property_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  property_postgres_data:

