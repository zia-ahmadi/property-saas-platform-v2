openapi: 3.1.0
info:
  title: Property SaaS Maintenance API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/organizations/{organizationId}/maintenance:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Search an organization's maintenance queue
      parameters:
        - { name: propertyId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - name: search
          in: query
          description: Case-insensitive substring of title, property, unit number, or assignee.
          schema: { type: string, maxLength: 150 }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Matching requests ordered by most recently updated
          content:
            application/json:
              schema:
                type: object
                required: [content, page, size, totalElements, totalPages, first, last]
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/Request' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  first: { type: boolean }
                  last: { type: boolean }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
    post:
      summary: Create an open maintenance request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Input' }
      responses:
        '201':
          description: Created request
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { description: Invalid input or location }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
  /api/v1/organizations/{organizationId}/maintenance/properties:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Find active properties available for a maintenance request
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated active properties in name order
          content:
            application/json:
              schema:
                type: object
                required: [content, page, size, totalElements, totalPages, first, last]
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  first: { type: boolean }
                  last: { type: boolean }
        '400': { description: Invalid query parameters }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
  /api/v1/organizations/{organizationId}/maintenance/summary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Count maintenance requests across the organization
      responses:
        '200':
          description: Organization-wide counts
          content:
            application/json:
              schema:
                type: object
                required: [open, inProgress, urgent, resolved]
                properties:
                  open: { type: integer }
                  inProgress: { type: integer }
                  urgent: { type: integer, description: Urgent requests that are open or in progress }
                  resolved: { type: integer }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
  /api/v1/organizations/{organizationId}/maintenance/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read a maintenance request
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
        '404': { description: Request not found in this organization }
    put:
      summary: Update a request's details and status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, status, version]
              properties:
                request: { $ref: '#/components/schemas/Input' }
                status: { $ref: '#/components/schemas/Status' }
                resolutionNotes: { type: [string, 'null'], maxLength: 4000 }
                version: { type: integer, minimum: 0, description: Version returned by the most recent read }
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '400': { description: Invalid input or location }
        '401': { description: Authentication required }
        '403': { description: Maintenance permission required in this organization }
        '404': { description: Request not found in this organization }
        '409': { description: The request changed since it was read }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CANCELLED] }
    Priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
    Input:
      type: object
      required: [propertyId, title, description, category, priority]
      properties:
        propertyId: { type: string, format: uuid }
        unitId: { type: [string, 'null'], format: uuid, description: Optional unit belonging to the selected property }
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        category: { type: string, enum: [PLUMBING, ELECTRICAL, HVAC, APPLIANCE, GENERAL, OTHER] }
        priority: { $ref: '#/components/schemas/Priority' }
        assignedTo: { type: [string, 'null'], maxLength: 150 }
        dueDate: { type: [string, 'null'], format: date }
    Request:
      allOf:
        - $ref: '#/components/schemas/Input'
        - type: object
          required: [id, propertyName, unitNumber, reportedBy, status, resolutionNotes, resolvedAt, createdAt, updatedAt, version]
          properties:
            id: { type: string, format: uuid }
            propertyName: { type: string }
            unitNumber: { type: [string, 'null'] }
            reportedBy: { type: [string, 'null'], format: uuid }
            status: { $ref: '#/components/schemas/Status' }
            resolutionNotes: { type: [string, 'null'], maxLength: 4000 }
            resolvedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer, minimum: 0 }
