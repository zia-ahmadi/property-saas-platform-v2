openapi: 3.1.0
info:
  title: Rent billing
  version: 1.0.0
  description: All operations require an active organization membership with BILLING_MANAGE. Billing status and summary
    calculations use the current UTC date.
security:
- {bearerAuth: []}
paths:
  /api/v1/organizations/{organizationId}/billing/invoices:
    parameters:
    - name: organizationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: listRentInvoices
      summary: List rent invoices
      parameters:
      - name: page
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: size
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      - name: search
        in: query
        schema: {type: string, maxLength: 150, default: ''}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/InvoiceStatus'}
      responses:
        '200':
          description: Page of invoices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoicePage'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
    post:
      operationId: issueRentInvoice
      summary: Issue a rent invoice
      description: The billing month must overlap the term of an active or ended lease with positive monthly rent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueInvoice'}
      responses:
        '201':
          description: Invoice issued
          headers:
            Location:
              description: Relative URL of the created resource
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDetails'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
        '404': {description: Resource not found in the requested organization}
        '409': {description: 'Invoice already exists for this lease and month, or the lease is ineligible'}
  /api/v1/organizations/{organizationId}/billing/invoices/summary:
    parameters:
    - name: organizationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getBillingSummary
      summary: Read billing counts and totals by currency
      responses:
        '200':
          description: Billing summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingSummary'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
  /api/v1/organizations/{organizationId}/billing/invoices/{id}:
    parameters:
    - name: organizationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getRentInvoice
      summary: Read an invoice and its recorded payments
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDetails'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
        '404': {description: Resource not found in the requested organization}
  /api/v1/organizations/{organizationId}/billing/invoices/{id}/payments:
    parameters:
    - name: organizationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: recordRentPayment
      summary: Record an invoice payment
      description: Use the current invoice version. The received date must be today or earlier in UTC.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordPayment'}
      responses:
        '200':
          description: Invoice with recorded payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDetails'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
        '404': {description: Resource not found in the requested organization}
        '409': {description: Invoice version is stale or the payment does not fit the outstanding balance}
  /api/v1/organizations/{organizationId}/billing/invoices/{id}/void:
    parameters:
    - name: organizationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: voidRentInvoice
      summary: Void an unpaid invoice
      description: Use the current invoice version and provide a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoidInvoice'}
      responses:
        '200':
          description: Voided invoice
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDetails'}
        '400': {description: Invalid request}
        '401': {description: Bearer access token required or invalid}
        '403': {description: Active organization membership and the required permission are required}
        '404': {description: Resource not found in the requested organization}
        '409': {description: 'Invoice version is stale, the invoice has payments, or the invoice is already void'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    InvoiceStatus: {type: string, enum: [OPEN, PARTIALLY_PAID, OVERDUE, PAID, VOID]}
    PaymentMethod: {type: string, enum: [CASH, BANK_TRANSFER, CHECK, OTHER]}
    Invoice:
      type: object
      required: [id, invoiceNumber, leaseId, renterName, propertyName, unitNumber, billingMonth, dueOn, currency, amount,
        paidAmount, balance, status, issuedAt, voidedAt, voidReason, version]
      properties:
        id: {type: string, format: uuid}
        invoiceNumber: {type: integer, format: int64, minimum: 0}
        leaseId: {type: string, format: uuid}
        renterName: {type: string}
        propertyName: {type: string}
        unitNumber: {type: string}
        billingMonth: {type: string, format: date}
        dueOn: {type: string, format: date}
        currency: {type: string, description: Invoice currency code}
        amount: {type: number}
        paidAmount: {type: number}
        balance: {type: number}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        issuedAt: {type: string, format: date-time}
        voidedAt: {type: [string, 'null'], format: date-time}
        voidReason: {type: [string, 'null']}
        version: {type: integer, format: int64, minimum: 0}
    InvoicePage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/Invoice'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
        first: {type: boolean}
        last: {type: boolean}
    IssueInvoice:
      type: object
      required: [leaseId, billingMonth, dueOn]
      properties:
        leaseId: {type: string, format: uuid}
        billingMonth: {type: string, format: date, description: First day of the billing month}
        dueOn: {type: string, format: date}
    RecordPayment:
      type: object
      required: [amount, receivedOn, method, version]
      properties:
        amount: {type: number, exclusiveMinimum: 0, maximum: 9999999999.99, multipleOf: 0.01}
        receivedOn: {type: string, format: date}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        reference: {type: [string, 'null'], maxLength: 150}
        version: {type: integer, format: int64, minimum: 0}
    VoidInvoice:
      type: object
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, pattern: \S}
        version: {type: integer, format: int64, minimum: 0}
    Payment:
      type: object
      required: [id, amount, receivedOn, method, reference, recordedAt]
      properties:
        id: {type: string, format: uuid}
        amount: {type: number}
        receivedOn: {type: string, format: date}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        reference: {type: [string, 'null']}
        recordedAt: {type: string, format: date-time}
    InvoiceDetails:
      type: object
      required: [invoice, payments, asOf]
      properties:
        invoice: {$ref: '#/components/schemas/Invoice'}
        payments:
          type: array
          items: {$ref: '#/components/schemas/Payment'}
        asOf: {type: string, format: date}
    BillingTotals:
      type: object
      required: [currency, outstanding, overdue, collected]
      properties:
        currency: {type: string, description: Invoice currency code}
        outstanding: {type: number}
        overdue: {type: number}
        collected: {type: number}
    BillingSummary:
      type: object
      required: [open, overdue, paid, totals, asOf]
      properties:
        open: {type: integer, format: int64, minimum: 0}
        overdue: {type: integer, format: int64, minimum: 0}
        paid: {type: integer, format: int64, minimum: 0}
        totals:
          type: array
          items: {$ref: '#/components/schemas/BillingTotals'}
        asOf: {type: string, format: date}
