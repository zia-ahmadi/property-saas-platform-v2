# Same-origin routing for the Property SaaS SPA.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Container health probe used by Docker Compose.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API reverse proxy. `proxy_pass` has no URI part, so the original request
    # URI (including the /api prefix the Spring controllers are mapped under)
    # is forwarded verbatim to the backend.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Authenticated API responses must never be cached by the browser.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_pass http://property-core:8081;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Auth endpoints set cookies and must not be buffered or rewritten.
        proxy_buffering off;
    }

    # Vite emits content-hashed filenames here, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the SPA entry point and must always be revalidated.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
