# Nginx configuration for the Property SaaS single-page application.
#
# Base image: nginxinc/nginx-unprivileged (already runs as UID 101 and listens
# on the unprivileged port 8080).
#
#   /        -> React SPA (history fallback to /index.html)
#   /api/    -> Spring Boot (property-core:8081); the /api prefix is preserved
#   /healthz -> container health probe

worker_processes  auto;

# /var/log/nginx is symlinked to the container's stdout/stderr by the base image.
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Temp paths under /tmp so the non-root runtime user can write them.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact server version.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Compress text assets; the SPA is served with immutable hashed filenames.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    client_max_body_size 2m;

    include /etc/nginx/conf.d/*.conf;
}
